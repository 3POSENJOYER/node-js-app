name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, build, and smoke test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://kino:kino-password@localhost:5432/kinokadr
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kinokadr
          POSTGRES_USER: kino
          POSTGRES_PASSWORD: kino-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kino -d kinokadr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend syntax
        working-directory: backend
        run: node --check server.js

      - name: Smoke test backend API
        working-directory: backend
        run: |
          set -eu
          node server.js > /tmp/cinema-backend.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:5000/api/health > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            cat /tmp/cinema-backend.log
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:5000/api/movies?date="$(date -u +%F)" \
            | node -e "let body=''; process.stdin.on('data', chunk => body += chunk); process.stdin.on('end', () => { const data = JSON.parse(body); if (data.movies.length !== 5 || data.movies.some(movie => movie.showtimes.length === 0)) process.exit(1); console.log('Movie catalog API smoke test passed'); });"

          node <<'NODE'
          const assert = require('node:assert/strict')

          async function checkBookingApi() {
            const date = new Date().toISOString().slice(0, 10)
            const showtimeId = `${date}_dune_1320`
            const bookingResponse = await fetch('http://127.0.0.1:5000/api/bookings', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                showtimeId,
                seats: ['A1', 'A2'],
                name: 'CI Test',
                email: 'ci@example.com',
              }),
            })
            assert.equal(bookingResponse.status, 201)
            const { booking } = await bookingResponse.json()
            assert.deepEqual(booking.seats, ['A1', 'A2'])
            assert.equal(booking.total, 440)

            const conflictResponse = await fetch('http://127.0.0.1:5000/api/bookings', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                showtimeId,
                seats: ['A2'],
                name: 'CI Test',
                email: 'ci@example.com',
              }),
            })
            assert.equal(conflictResponse.status, 409)

            const simultaneousShowtimeId = `${date}_dune_1640`
            const simultaneousBookings = await Promise.all(
              [1, 2].map(() => fetch('http://127.0.0.1:5000/api/bookings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  showtimeId: simultaneousShowtimeId,
                  seats: ['B1'],
                  name: 'CI Test',
                  email: 'ci@example.com',
                }),
              })),
            )
            assert.deepEqual(
              simultaneousBookings.map(({ status }) => status).sort((a, b) => a - b),
              [201, 409],
            )

            const seatsResponse = await fetch(`http://127.0.0.1:5000/api/showtimes/${showtimeId}/seats`)
            assert.deepEqual((await seatsResponse.json()).bookedSeats, ['A1', 'A2'])

            const lookupResponse = await fetch('http://127.0.0.1:5000/api/bookings?email=ci%40example.com')
            const { bookings } = await lookupResponse.json()
            assert.equal(bookings.length, 2)
            assert.ok(bookings.some(({ code }) => code === booking.code))
            console.log('PostgreSQL booking API smoke test passed')
          }

          checkBookingApi().catch((error) => {
            console.error(error)
            process.exitCode = 1
          })
          NODE

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  container-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: cinema-frontend:ci

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: cinema-backend:ci

  publish:
    name: Publish images to Docker Hub
    runs-on: ubuntu-latest
    needs: [checks, container-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/node-js-app-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}

      - name: Create backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/node-js-app-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
